services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: rag-postgres

    environment:
      POSTGRES_DB: ragdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5433:5432"

    volumes:
      - rag_postgres_data:/var/lib/postgresql/data

  ollama:
    image: ollama/ollama:latest
    container_name: rag-ollama

    ports:
      - "11434:11434"

    volumes:
      - rag_ollama_data:/root/.ollama

  reranker:
    build:
      context: ./reranker

    container_name: rag-reranker

    ports:
      - "8001:8000"

    environment:
      HF_HOME: /models

    volumes:
      - rag_reranker_models:/models

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rag-rabbitmq
    ports:
      - "5672:5672"   # AMQP protocol port (MassTransit uses this to connect)
      - "15672:15672" # Management UI port (You use this to view the queues)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rag_rabbitmq_data:/var/lib/rabbitmq


volumes:
  rag_postgres_data:
  rag_ollama_data:
  rag_reranker_models:
  rag_rabbitmq_data:
