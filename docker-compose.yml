services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: rag-postgres

    environment:
      POSTGRES_DB: ragdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5433:5432"

    volumes:
      - rag_postgres_data:/var/lib/postgresql/data

  ollama:
    image: ollama/ollama:latest
    container_name: rag-ollama

    ports:
      - "11434:11434"

    volumes:
      - rag_ollama_data:/root/.ollama

  reranker:
    build:
      context: ./reranker

    container_name: rag-reranker

    ports:
      - "8001:8000"

    environment:
      HF_HOME: /models

    volumes:
      - rag_reranker_models:/models


volumes:
  rag_postgres_data:
  rag_ollama_data:
  rag_reranker_models:
